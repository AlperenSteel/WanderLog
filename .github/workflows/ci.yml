name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────── Lint + Typecheck ───────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @wanderprint/api lint

      - name: Typecheck (backend)
        run: pnpm --filter @wanderprint/api typecheck

      - name: Typecheck (shared)
        run: pnpm --filter @wanderprint/shared typecheck

  # ─────────────────────── Test + Migration Check ───────────────────────
  test:
    name: Test & Migration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wanderprint
          POSTGRES_PASSWORD: wanderprint_dev
          POSTGRES_DB: wanderprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wanderprint -d wanderprint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wanderprint:wanderprint_dev@localhost:5432/wanderprint_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_test_access_secret_32_chars_xx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_chars_x
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV: test
      PORT: 3000
      API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @wanderprint/api db:generate

      - name: Apply schema to DB
        # migrations klasörü henüz yok; db push schema’yı doğrudan uygular.
        # İlk gerçek migration açıldığında bu adım’ı ‘migrate deploy’ ile değiştir.
        run: pnpm --filter @wanderprint/api exec prisma db push --accept-data-loss

      - name: Migration drift check
        # Migration’lar olmadan bu adım atlansın
        run: |
          if [ -d "backend/prisma/migrations" ] && [ "$(ls -A backend/prisma/migrations)" ]; then
            pnpm --filter @wanderprint/api exec prisma migrate diff \
              --from-migrations ./prisma/migrations \
              --to-schema-datamodel ./prisma/schema.prisma \
              --shadow-database-url "$DATABASE_URL" \
              --exit-code
          else
            echo "⚠️  Migration klasörü boş — drift kontrolü atlandı"
          fi

      - name: Run tests
        run: pnpm --filter @wanderprint/api test
