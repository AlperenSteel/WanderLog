services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wanderprint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wanderprint
      POSTGRES_PASSWORD: wanderprint_dev
      POSTGRES_DB: wanderprint_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderprint -d wanderprint_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wanderprint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
